[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-postcode-lookup"
version = "1.0.1"
description = "Pluggable postcode lookup endpoint"
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.7"
authors = [
  { name = "Michael van Tellingen", email = "michaelvantellingen@gmail.com" },
]
keywords = ["postcode", "api", "validation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
]
dependencies = [
  "Django>=3.2,<4",
  "attrs",
  "djangorestframework>=3,<4",
  "requests>=2.7",
]

[project.urls]
Homepage = "https://github.com/labd/django-postcode-lookup"

[project.optional-dependencies]
docs = [
  "sphinx>=1.5.2",
]
test = [
  "freezegun==1.1.0",
  "pretend==1.0.9",
  "pytest-cov==2.11.1",
  "pytest-django==4.1.0",
  "pytest==6.1.2",
  "requests-mock==1.8.0",
  "coverage==5.3",
  "isort<5",
  "flake8==3.8.4",
  "flake8-blind-except==0.1.1",
  "flake8-debugger==3.2.1",
]

[dependency-groups]
test = [
  "freezegun==1.1.0",
  "pretend==1.0.9",
  "pytest-cov==2.11.1",
  "pytest-django==4.1.0",
  "pytest==6.1.2",
  "requests-mock==1.8.0",
  "coverage==5.3",
  "isort<5",
  "flake8==3.8.4",
  "flake8-blind-except==0.1.1",
  "flake8-debugger==3.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_postcode_lookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
