[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-postcode-lookup"
version = "1.0.1"
description = "Pluggable postcode lookup endpoint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Michael van Tellingen", email = "michaelvantellingen@gmail.com" },
]
keywords = ["postcode", "api", "validation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Django>=3.2,<4",
  "attrs",
  "djangorestframework>=3,<4",
  "requests>=2.7",
]

[project.urls]
Homepage = "https://github.com/labd/django-postcode-lookup"

[dependency-groups]
test = [
  "freezegun==1.5.5",
  "pretend==1.0.9",
  "pytest-cov==7.1.0",
  "pytest-django==4.12.0",
  "pytest==9.0.3",
  "requests-mock==1.12.1",
  "coverage==7.14.0",
  "isort==8.0.1",
  "flake8==7.3.0",
  "flake8-blind-except==0.2.1",
  "flake8-debugger==4.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_postcode_lookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
