[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-postcode-lookup"
version = "2.0.0.alpha.0"
description = "Pluggable postcode lookup endpoint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Michael van Tellingen", email = "michaelvantellingen@gmail.com" },
]
keywords = ["postcode", "api", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Django>=5.2",
  "attrs>=26.1.0",
  "djangorestframework>=3.17.1",
  "requests>=2.34.0",
]

[project.urls]
Homepage = "https://github.com/labd/django-postcode-lookup"
Changelog = "https://github.com/labd/django-postcode-lookup/blob/master/CHANGELOG.md"

[dependency-groups]
test = [
  "freezegun==1.5.5",
  "pretend==1.0.9",
  "pytest-cov==7.1.0",
  "pytest-django==4.12.0",
  "pytest==9.0.3",
  "requests-mock==1.12.1",
  "coverage==7.14.0",
  "ruff==0.14.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_postcode_lookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = [
  "BLE",
  "C90",
  "D",
  "E",
  "F",
  "I",
  "T10",
  "W",
]
ignore = ["D1", "D400", "D401", "E731", "F405", "F821"]
mccabe.max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.coverage.html]
directory = "reports/covhtml"

[tool.coverage.xml]
output = "reports/coverage.xml"
