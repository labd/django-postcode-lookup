[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-postcode-lookup"
version = "2.0.0"
description = "Pluggable postcode lookup endpoint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Michael van Tellingen", email = "michaelvantellingen@gmail.com" },
]
keywords = ["postcode", "api", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Django>=4.2",
  "attrs>=26.1.0",
  "djangorestframework>=3.17.1",
  "requests>=2.34.0",
]

[project.urls]
Homepage = "https://github.com/labd/django-postcode-lookup"
Changelog = "https://github.com/labd/django-postcode-lookup/blob/master/CHANGELOG.md"

[dependency-groups]
test = [
  "freezegun==1.5.5",
  "pretend==1.0.9",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest==9.1.1",
  "requests-mock==1.12.1",
  "coverage==7.17.0",
  "ruff==0.17.2",
]

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2
coverage = "2026-10-27T00:00:00Z"  # pyproject requires ==7.17.0
ruff = "2026-10-27T00:00:00Z"  # pyproject requires ==0.17.2

[tool.hatch.build.targets.wheel]
packages = ["src/django_postcode_lookup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "BLE",
  "C90",
  "D",
  "E",
  "F",
  "I",
  "T10",
  "W",
]
ignore = ["D1", "D400", "D401", "E731", "F405", "F821"]
mccabe.max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.coverage.html]
directory = "reports/covhtml"

[tool.coverage.xml]
output = "reports/coverage.xml"
