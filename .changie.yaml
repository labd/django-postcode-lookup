changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'
kinds:
  - label: Added
    key: added
    auto: minor
  - label: Changed
    key: changed
    auto: minor
  - label: Deprecated
    key: deprecated
    auto: minor
  - label: Removed
    key: removed
    auto: major
  - label: Fixed
    key: fixed
    auto: patch
  - label: Security
    key: security
    auto: patch
newlines:
  afterChangelogHeader: 1
  afterChangelogVersion: 1
  beforeKind: 1
  afterKind: 1
  endOfVersion: 1
replacements:
  - path: pyproject.toml
    find: '^version = ".*"$'
    replace: 'version = "{{.VersionNoPrefix}}"'
  - path: src/django_postcode_lookup/__init__.py
    find: '^VERSION = \(.*\)$'
    replace: 'VERSION = ({{.Major}}, {{.Minor}}, {{.Patch}}, "final", 1)'
