name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2.*", "6.0.*", "6.1.*"]
        exclude:
          - python-version: "3.11"
            django-version: "6.0.*"
          - python-version: "3.11"
            django-version: "6.1.*"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --group test

      - name: Install Django ${{ matrix.django-version }}
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: uv pip install "Django==${DJANGO_VERSION}"

      - name: Check formatting
        run: uv run --group test ruff format --check

      - name: Run lint
        run: uv run --group test ruff check

      - name: Run tests
        run: uv run --group test pytest

  release:
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # Creates or updates the release PR, or tags and releases the version
      # once it is merged. The GitHub release is created with the app token,
      # so it triggers python-release.yml, which publishes to PyPI.
      - name: Release
        uses: labd/changie-release-action@059406879b04f6e073547b325fbbff9a573038e3 # v2.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # uv.lock contains the project version as well
          version-command: uv lock
          create-release: true
